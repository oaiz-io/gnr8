[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdk"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["pydantic>=2"]

[project.scripts]
"bookstore" = "sdk.cli:main"

[tool.setuptools]
packages = ["sdk", "sdk.cli", "sdk.cli.commands"]

[tool.setuptools.package-dir]
"sdk" = "."
"sdk.cli" = "cli"
"sdk.cli.commands" = "cli/commands"
