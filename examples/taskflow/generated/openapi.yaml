openapi: 3.1.0
info:
  title: Taskflow API
  version: 0.1.0
security:
  - ApiKeyAuth: []
paths:
  '/tasks':
    get:
      operationId: listTasks
      summary: Returns every task.
      description: Pass a status to narrow the results to one status; omit it to list everything.
      tags: [tasks]
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Response 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
    post:
      operationId: createTask
      summary: Creates a task.
      description: "The task starts in the pending status and is returned with its generated\nidentifier."
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Response 201
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Response 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  '/tasks/_debug':
    get:
      operationId: debugTasks
      summary: Handles the internal GET /tasks/_debug endpoint.
      description: "The .gnr8/ pipeline\nkeeps this route generated so change reporting can apply explicit tag-based gate policy."
      tags: [internal, tasks]
      responses:
        '200':
          description: Response 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
  '/tasks/{id}':
    get:
      operationId: getTask
      summary: Returns one task by its identifier.
      tags: [tasks]
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Response 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateTask
      summary: Replaces the mutable fields of one task.
      description: Fields omitted from the payload keep their current values.
      tags: [tasks]
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Response 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Response 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteTask
      summary: Permanently removes one task.
      tags: [tasks]
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    AssigneeInput:
      type: object
      properties:
        email:
          type: [string, 'null']
        id:
          type: [string, 'null']
        name:
          type: [string, 'null']
    AssigneeOutput:
      type: object
      required: [email, id, name]
      properties:
        email:
          type: string
        id:
          type: string
        name:
          type: string
    CreateTaskRequest:
      type: object
      required: [status, title]
      properties:
        assignee:
          oneOf:
          - $ref: '#/components/schemas/AssigneeInput'
          - type: 'null'
        dueAt:
          type: [string, 'null']
          format: date-time
        labels:
          type: [array, 'null']
          items:
            type: string
        notes:
          type: [string, 'null']
        priority:
          type: [integer, 'null']
        status:
          $ref: '#/components/schemas/Status'
        title:
          type: string
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    Status:
      type: string
      enum: [done, in_progress, open]
    Task:
      type: object
      required: [assignee, dueAt, id, labels, priority, status, title]
      properties:
        assignee:
          $ref: '#/components/schemas/AssigneeOutput'
        dueAt:
          type: string
          format: date-time
        id:
          type: string
        labels:
          type: [array, 'null']
          items:
            type: string
        notes:
          type: string
        priority:
          type: integer
        status:
          $ref: '#/components/schemas/Status'
        title:
          type: string
    TaskList:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/Task'
    UpdateTaskRequest:
      type: object
      properties:
        labels:
          type: [array, 'null']
          items:
            type: string
        notes:
          type: [string, 'null']
        priority:
          type: [integer, 'null']
        status:
          oneOf:
          - $ref: '#/components/schemas/Status'
          - type: 'null'
        title:
          type: [string, 'null']
