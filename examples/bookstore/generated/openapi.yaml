openapi: 3.1.0
info:
  title: Bookstore API
  version: 0.1.0
security:
  - ApiKeyAuth: []
paths:
  '/books':
    get:
      operationId: listBooks
      summary: Returns every book in the catalogue.
      description: Pass a genre to narrow the results to one genre; omit it to list everything.
      tags: [books]
      parameters:
      - name: genre
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Response 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookList'
    post:
      operationId: createBook
      summary: Adds a book to the catalogue.
      description: The book is stored immediately and returned with its generated identifier.
      tags: [books]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookRequest'
      responses:
        '201':
          description: Response 201
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: Response 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  '/books/{id}':
    get:
      operationId: getBook
      summary: Returns one book by its identifier.
      tags: [books]
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: Response 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateBook
      summary: Replaces the mutable fields of one book.
      description: Fields omitted from the payload keep their current values.
      tags: [books]
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookRequest'
      responses:
        '200':
          description: Response 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: Response 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteBook
      summary: Permanently removes one book from the catalogue.
      tags: [books]
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Book:
      type: object
      required: [author, genre, id, price, publishedAt, publisher, tags, title]
      properties:
        author:
          type: string
        genre:
          $ref: '#/components/schemas/Genre'
        id:
          type: string
        price:
          type: number
        publishedAt:
          type: string
          format: date-time
        publisher:
          $ref: '#/components/schemas/PublisherOutput'
        subtitle:
          type: string
        tags:
          type: [array, 'null']
          items:
            type: string
        title:
          type: string
    BookList:
      type: object
      required: [books]
      properties:
        books:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/Book'
    CreateBookRequest:
      type: object
      required: [author, genre, title]
      properties:
        author:
          type: string
        genre:
          $ref: '#/components/schemas/Genre'
        price:
          type: [number, 'null']
        publisher:
          oneOf:
          - $ref: '#/components/schemas/PublisherInput'
          - type: 'null'
        subtitle:
          type: [string, 'null']
        tags:
          type: [array, 'null']
          items:
            type: string
        title:
          type: string
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    Genre:
      type: string
      enum: [fiction, mystery, nonfiction, romance, scifi]
    PublisherInput:
      type: object
      properties:
        country:
          type: [string, 'null']
        name:
          type: [string, 'null']
    PublisherOutput:
      type: object
      required: [country, name]
      properties:
        country:
          type: string
        name:
          type: string
    UpdateBookRequest:
      type: object
      properties:
        author:
          type: [string, 'null']
        genre:
          oneOf:
          - $ref: '#/components/schemas/Genre'
          - type: 'null'
        price:
          type: [number, 'null']
        subtitle:
          type: [string, 'null']
        tags:
          type: [array, 'null']
          items:
            type: string
        title:
          type: [string, 'null']
