openapi: 3.1.0
info:
  title: Bookstore Orders API
  version: 0.1.0
paths:
  '/orders/':
    get:
      operationId: list_orders
      summary: List orders, optionally narrowed to one stock status.
      description: "Orders are returned newest first. Omit the status filter to list every order\nregardless of availability."
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Response 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderConfirmation'
    post:
      operationId: create_order
      summary: Place a new order.
      description: The order is confirmed immediately and its confirmation number is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: Response 201
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderConfirmation'
  '/orders/raw':
    post:
      operationId: create_order_raw
      summary: Place an order from a raw, unvalidated payload.
      description: "Provided for clients that cannot produce the typed order shape. The payload is\naccepted as-is and validated downstream."
      responses:
        '201':
          description: Response 201
  '/orders/{order_id}':
    get:
      operationId: get_order
      summary: Fetch one order by its identifier.
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Response 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderConfirmation'
components:
  schemas:
    Availability:
      type: string
      enum: [in_stock, out_of_stock]
    OrderConfirmation:
      type: object
      required: [availability, lines, message, order_id]
      properties:
        availability:
          $ref: '#/components/schemas/Availability'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/Price'
        message:
          type: [string, 'null']
        order_id:
          type: integer
    OrderInput:
      type: object
      required: [book_id, price]
      properties:
        book_id:
          type: integer
        coupon:
          type: [string, 'null']
        discount:
          oneOf:
          - oneOf:
            - type: integer
            - type: number
          - type: 'null'
        note:
          type: [string, 'null']
        price:
          $ref: '#/components/schemas/Price'
        quantity:
          type: integer
        tags:
          type: array
          items:
            type: string
    Price:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
        currency:
          type: string
          enum: [eur, usd]
