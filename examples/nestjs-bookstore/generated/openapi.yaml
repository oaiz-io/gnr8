openapi: 3.1.0
info:
  title: Bookstore API
  version: 0.1.0
paths:
  '/books/':
    get:
      operationId: listBooks
      summary: List books in one genre.
      description: "Results are ordered by title and paginated with an opaque cursor. Pass the\ncursor from the previous page to continue; omit it to start from the beginning."
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: genre
        in: query
        required: true
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Response 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBooksResponse'
    post:
      operationId: createBook
      summary: Add a book to the catalogue.
      description: The book is created immediately and its generated identifier is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookDto'
      responses:
        '201':
          description: Response 201
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedMessage'
  '/books/{bookId}':
    get:
      operationId: getBook
      summary: Fetch one book by its identifier.
      description: Returns the book when it is in stock, and an out-of-stock notice otherwise.
      parameters:
      - name: bookId
        in: path
        required: true
        schema:
          type: number
      - name: fmt
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/BookFormat'
      responses:
        '200':
          description: Response 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookOrError'
    put:
      operationId: updateBook
      summary: Update the stored filters for one book.
      description: Filters left unset in the payload keep their current values.
      parameters:
      - name: bookId
        in: path
        required: true
        schema:
          type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookFilters'
      responses:
        '200':
          description: Response 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedMessage'
components:
  schemas:
    AuthorDto:
      type: object
      required: [bio, name]
      properties:
        bio:
          type: [string, 'null']
        name:
          type: string
    BookDto:
      type: object
      required: [author, format, id, title]
      properties:
        author:
          $ref: '#/components/schemas/AuthorDto'
        format:
          $ref: '#/components/schemas/BookFormat'
        id:
          type: number
        rating:
          type: [number, 'null']
        tags:
          type: array
          items:
            type: string
        title:
          type: string
    BookFilters:
      type: object
      required: [genre, published]
      properties:
        genre:
          type: string
        inStock:
          type: boolean
        published:
          type: [number, 'null']
        sort:
          type: [string, 'null']
          enum: [asc, desc, null]
    BookFormat:
      type: string
      enum: [hardcover, paperback]
    BookOrError:
      oneOf:
      - $ref: '#/components/schemas/BookDto'
      - $ref: '#/components/schemas/OutOfStockDto'
    CreatedMessage:
      type: object
      required: [id, message]
      properties:
        id:
          type: number
        message:
          type: string
    ListBooksResponse:
      type: object
      required: [books, nextCursor, total]
      properties:
        books:
          type: array
          items:
            $ref: '#/components/schemas/BookDto'
        nextCursor:
          type: [string, 'null']
        total:
          type: number
    OutOfStockDto:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
