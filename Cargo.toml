# gnr8 — Cargo workspace root.
# Single source of truth for shared lint policy (D-08) and dependency versions
# (verified 2026-06-24 against the crates.io sparse index — see 01-RESEARCH.md).
[workspace]
members = ["crates/gnr8-sdk", "crates/gnr8-core", "crates/gnr8"]
resolver = "2"

[workspace.package]
version = "0.14.1"
edition = "2021"        # D-08
rust-version = "1.85"   # MSRV floor: clap 4.6 requires 1.85
license = "MIT"         # matches repo LICENSE
readme = "README.md"
repository = "https://github.com/oaiz-io/gnr8"
homepage = "https://github.com/oaiz-io/gnr8"
documentation = "https://docs.rs/gnr8"
description = "Code-first API extraction to OpenAPI 3.1 and generated client SDKs"
keywords = ["openapi", "sdk", "codegen", "agents", "api"]
categories = ["development-tools"]

# Shared lint policy (rust-best-practices skill ch.2 + D-08).
# `priority` resolves conflicts: a lower priority is overridden by a higher one;
# group-level lints use priority -1 so individual lints below them win.
[workspace.lints.rust]
unsafe_code = "forbid"      # T-01-02: no unsafe memory in gnr8 internals
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# RUST-04 / T-01-03 enforcement: ban panicking paths in production code.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"               # surface scaffolding TODOs without failing the build

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
thiserror = "2.0"           # NOTE: v2, not v1
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
noyalib = "0.0.8"
toml = "0.8"
insta = { version = "1.48", features = ["yaml"] }
# Phase-4 lifecycle/watch runtime crates — versions verified 2026-06-24 against the
# crates.io sparse index (04-RESEARCH.md). Pinned here as the single source of truth;
# member crates reference them with `{ workspace = true }`. Stable releases ONLY — the
# notify 9.0 / debouncer 0.8 release candidates are deliberately NOT used.
blake3 = "1.8"                  # content hashing for the ownership manifest (consumed in 04-02)
# Capability-relative filesystem access keeps generated writes inside the project directory even if
# an output path is changed to a symlink between validation and I/O. cap-fs-ext supplies no-follow
# opens for the final component; neither crate defines product behavior.
cap-std = "4.0"
cap-fs-ext = "4.0"
# OS-held file locks serialize generated-output transactions and are released automatically if a
# process exits, so recovery never mistakes another live gnr8 process for a crashed writer.
fs2 = "0.4"
# Cross-platform file identity distinguishes a case-insensitive spelling alias from a distinct
# hard-linked output during generated-file renames.
same-file = "1.0"
# Portable artifact identity uses Unicode normalization + full case folding so output collisions are
# rejected consistently before reaching case-insensitive or normalization-insensitive filesystems.
unicode-normalization = "0.1"
unicode-casefold = "0.2"
# Atomic no-clobber rename is the commit primitive for staged generated files on Unix.
rustix = { version = "1.1", features = ["fs", "pipe"] }
# A focused Windows-only wrapper supplies MoveFileExW's atomic fail-if-destination-exists move on
# filesystems that do not support hard links. windows-sys constants configure directory durability.
atomicwrites = "0.4"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
winx = "0.36"
notify-debouncer-full = "0.7"   # debounced FS watcher for `gnr8 watch` (consumed in 04-03)
ctrlc = "3.5"                   # graceful Ctrl-C → AtomicBool for the watch loop (consumed in 04-03;
                                # the FSEvents backend suppresses the default SIGINT disposition, so the
                                # std-only approach proved insufficient — RESEARCH A5 sanctioned fallback)
# The published thin SDK a project's `.gnr8/` worker links.
gnr8 = { path = "crates/gnr8-sdk", version = "0.14.1" }
# The host engine: extraction, lowering, SDK emission, lifecycle. Never a `.gnr8/` dependency.
gnr8-engine = { path = "crates/gnr8-core", version = "0.14.1" }
