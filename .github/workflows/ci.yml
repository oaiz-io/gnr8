name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# npm's post-install audit round-trip, not the install itself, is what makes
# `npm ci` slow here: tsextract's two locked packages restore in ~0.7s without it
# and in 1-4 minutes with it. Every npm call in this workflow gets the same
# treatment, including the one `make tsextract-test` runs for itself.
env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check invariants and CI budgets
        run: make invariants

  rust-quality:
    name: Rust format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  rust-tests:
    name: Rust tests (${{ matrix.name || matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: gnr8
            needs_go: "false"
            needs_python: "false"
            needs_node: "false"
          - package: gnr8-engine
            needs_go: "true"
            needs_python: "true"
            needs_node: "true"
          # gnr8-cli is split: one cold `cargo test -p gnr8-cli` rebuilds the engine, links the
          # host binary, then cargo-builds a `.gnr8/` worker per compiling test. That blows the
          # 5-minute cap on a cache miss (lockfile/version bump). Each entry compiles only the
          # targets it runs; together they still execute every test exactly once. A new
          # crates/gnr8/tests/*.rs file must be added to one of the two test_args lists.
          - package: gnr8-cli
            name: gnr8-cli
            needs_go: "true"
            needs_python: "false"
            needs_node: "false"
            test_args: "--bins --test generate_e2e --test verify_e2e --test watch_smoke"
          - package: gnr8-cli
            name: gnr8-cli workers
            needs_go: "false"
            needs_python: "false"
            needs_node: "false"
            test_args: "--test worker_contract"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v6
        if: matrix.needs_go == 'true'
        with:
          go-version: "1.27"
          check-latest: true

      - uses: actions/setup-python@v6
        if: matrix.needs_python == 'true'
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v6
        if: matrix.needs_node == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tsextract/package-lock.json

      - name: Restore TypeScript test toolchain
        if: matrix.needs_node == 'true'
        run: npm ci --silent --no-audit
        working-directory: tsextract

      - name: Install independent YAML parser
        if: matrix.needs_python == 'true'
        run: python -m pip install PyYAML==6.0.2

      - uses: Swatinem/rust-cache@v2
        with:
          key: tests-${{ matrix.name || matrix.package }}

      - name: Test package
        run: cargo test -p "${{ matrix.package }}" --all-features ${{ matrix.test_args }}

  sidecars:
    name: Language sidecars and action contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          check-latest: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tsextract/package-lock.json

      - name: Test Go fixture and extractor
        run: make fixture-build goextract-build

      - name: Test Python extractor
        run: make pyextract-test

      - name: Test TypeScript extractor
        run: make tsextract-test

      - name: Test the composite action contract
        run: make action-test

  check:
    name: make check
    needs: [policy, rust-quality, rust-tests, sidecars]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every focused check
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          QUALITY_RESULT: ${{ needs.rust-quality.result }}
          RUST_RESULT: ${{ needs.rust-tests.result }}
          SIDECAR_RESULT: ${{ needs.sidecars.result }}
        run: |
          test "$POLICY_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$RUST_RESULT" = success
          test "$SIDECAR_RESULT" = success
