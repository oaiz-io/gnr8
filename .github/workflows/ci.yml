name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# npm's post-install audit round-trip, not the install itself, is what makes
# `npm ci` slow here: tsextract's two locked packages restore in ~0.7s without it
# and in 1-4 minutes with it. Every npm call in this workflow gets the same
# treatment, including the one `make tsextract-test` runs for itself.
env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check invariants and CI budgets
        run: make invariants

  rust-quality:
    name: Rust format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  rust-tests:
    name: Rust tests (${{ matrix.name || matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: gnr8
            needs_go: "false"
            needs_python: "false"
            needs_node: "false"
          # Keep the slower compile-and-run suites in their own job so cold engine runs
          # leave room for cache upload within the five-minute cap.
          - package: gnr8-engine
            needs_go: "true"
            needs_python: "true"
            needs_node: "true"
            test_args: "--lib --test cli_body_help --test cli_emit --test contract_tests --test docs_emit --test gin_contract_regression --test gosdk_split_wire_helpers --test lifecycle --test open_object --test pysdk_compile --test sdk_call_shape --test sdk_lint --test sdk_model_presence --test sdk_model_reach --test sdk_pipeline --test sdk_surface_flexibility_e2e --test snapshot_diagnostics --test snapshot_docs --test snapshot_fastapi_graph --test snapshot_fastapi_openapi --test snapshot_flask_graph --test snapshot_flask_openapi --test snapshot_graph --test snapshot_nestjs_graph --test snapshot_nestjs_openapi --test snapshot_openapi --test snapshot_sdk --test target_exclusion --test tssdk_compile --test tssdk_request_wire"
            doctests: "true"
          - package: gnr8-engine
            name: gnr8-engine compile checks
            needs_go: "true"
            needs_python: "true"
            needs_node: "true"
            test_args: "--test determinism --test docs_snippets_compile --test operation_prose --test sdk_compile"
          # gnr8-cli is split into four entries. A cold 2-4 core runner rebuilds the engine,
          # links the host binary, then cargo-builds a `.gnr8/` worker per compiling test; one
          # combined job exceeds the 5-minute cap on a cache miss (lockfile/version bump).
          # Unit tests + verify_e2e compile/run ~2-3m; generate_e2e's host binary + 2 worker
          # builds ~3-4m; worker_contract is proven at 2m22s cold. Each entry compiles only the
          # targets it runs; together they still execute every test exactly once. A new
          # crates/gnr8/tests/*.rs file must be added to one of the test_args lists.
          - package: gnr8-cli
            name: gnr8-cli
            needs_go: "true"
            needs_python: "false"
            needs_node: "false"
            test_args: "--bins --test verify_e2e --test watch_smoke"
          - package: gnr8-cli
            name: gnr8-cli generate e2e
            needs_go: "true"
            needs_python: "false"
            needs_node: "false"
            test_args: "--test generate_e2e"
          - package: gnr8-cli
            name: gnr8-cli workers
            needs_go: "false"
            needs_python: "false"
            needs_node: "false"
            test_args: "--test worker_contract"
          - package: gnr8-cli
            name: gnr8-cli committed outputs
            needs_go: "true"
            needs_python: "false"
            needs_node: "false"
            test_args: "--test committed_outputs"
          # The RustModels lifecycle builds one worker and the standalone consumer crate
          # (serde + serde_json) on top of the host binary, so it gets its own entry.
          - package: gnr8-cli
            name: gnr8-cli rust models
            needs_go: "true"
            needs_python: "false"
            needs_node: "false"
            test_args: "--test rust_models_e2e"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v6
        if: matrix.needs_go == 'true'
        with:
          go-version: "1.27"
          check-latest: true

      - uses: actions/setup-python@v6
        if: matrix.needs_python == 'true'
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v6
        if: matrix.needs_node == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tsextract/package-lock.json

      - name: Restore TypeScript test toolchain
        if: matrix.needs_node == 'true'
        run: npm ci --silent --no-audit
        working-directory: tsextract

      - name: Install Python test dependencies
        if: matrix.needs_python == 'true'
        run: python -m pip install PyYAML==6.0.2 pydantic==2.12.5

      # `sdk_lint` asserts the emitted Python needs no post-processing to be clean under the
      # language's usual linter/formatter, and it early-returns when `ruff` is missing. Without
      # this step that assertion never ran here, so a green run said nothing about it. Pinned for
      # the same reason PyYAML is: a formatter release may not turn CI red on its own schedule.
      - name: Install the Python linter the SDK lint gate needs
        if: matrix.needs_python == 'true'
        run: python -m pip install ruff==0.16.7

      - uses: Swatinem/rust-cache@v2
        with:
          key: tests-${{ matrix.name || matrix.package }}

      - name: Test package
        run: cargo test -p "${{ matrix.package }}" --all-features ${{ matrix.test_args }}

      - name: Test documentation
        if: matrix.doctests == 'true'
        run: cargo test -p "${{ matrix.package }}" --all-features --doc

  sidecars:
    name: Language sidecars and action contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          check-latest: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tsextract/package-lock.json

      - name: Test Go fixture and extractor
        run: make fixture-build goextract-build

      - name: Test Python extractor
        run: make pyextract-test

      - name: Test TypeScript extractor
        run: make tsextract-test

      - name: Test the composite action contract
        run: make action-test

  check:
    name: make check
    needs: [policy, rust-quality, rust-tests, sidecars]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every focused check
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          QUALITY_RESULT: ${{ needs.rust-quality.result }}
          RUST_RESULT: ${{ needs.rust-tests.result }}
          SIDECAR_RESULT: ${{ needs.sidecars.result }}
        run: |
          test "$POLICY_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$RUST_RESULT" = success
          test "$SIDECAR_RESULT" = success
