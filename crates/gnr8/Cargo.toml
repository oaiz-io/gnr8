[package]
name = "gnr8-cli"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description.workspace = true

[[bin]]
name = "gnr8"
path = "src/main.rs"
# This unpublished CLI binary is named `gnr8`, the same as the published thin SDK's lib target, so
# `cargo doc --workspace` would write both to `doc/gnr8/` and warn about the collision
# (rust-lang/cargo#6313). The binary has no library surface to document and never reaches docs.rs
# (`publish = false`), so `doc/gnr8/` belongs to the SDK crate.
doc = false

[lints]
workspace = true

[dependencies]
# The host engine. The thin `gnr8` SDK reaches the CLI only through this re-export, so
# nothing in the CLI can accidentally become a dependency of a user's `.gnr8/` crate.
gnr8-engine = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }       # derive Serialize on the CLI Report type for --json output
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }   # anyhow ONLY here, never in the SDK or the engine (D-09)
notify-debouncer-full = { workspace = true } # debounced FS watcher for `gnr8 watch` (binary boundary, D-09)
ctrlc = { workspace = true } # graceful Ctrl-C → AtomicBool stop flag for the watch loop (binary boundary)

[target.'cfg(windows)'.dependencies]
atomicwrites = { workspace = true }
